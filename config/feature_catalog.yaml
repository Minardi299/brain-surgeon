# category must be one of: weapons, deception, illegal, roleplay_jailbreak, refusal
# source: "neuronpedia-keyword" (v1) or "contrastive" (Option C, added later)
#
# !!! HAND-VERIFICATION STILL REQUIRED (plan Task 3, step 2) !!!
