# ACTIVATING EXAMPLES genuinely match the category. The roleplay_jailbreak
# features are the noisiest (Gemma Scope has no clean "jailbreak" feature at
# this layer) — verify those first, and consider swapping in better ones or
# adding a second layer. Note: observed maxActApprox for these features ranges
# into the tens (e.g. refusal 9989 ~= 90), so DANGER_THRESHOLD / REFUSAL_THRESHOLD
# in config.py (default 1.0) will need calibrating — see README.
