[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danger-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformer-lens>=2.0",
    "sae-lens>=4.0",
    "gradio>=6.0",
    "pyyaml>=6.0",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
